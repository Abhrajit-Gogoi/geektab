<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geek Tab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="custom-cursor"></div>
    <video id="intro-video" autoplay muted playsinline>
        <source src="media/intro.mp4" type="video/mp4">
    </video>
    <button id="skip-intro">Skip</button>

    <div id="loading">Geek Tab</div>

    <div class="sidebar">
        <div class="calendar-widget">
            <div class="calendar-header" id="calendar-month"></div>
            <div class="calendar-days">
                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div class="calendar-grid" id="calendar-dates"></div>
        </div>

        <div class="media-widget">
            <div class="media-art">
                <img id="media-cover" src="" alt="">
            </div>
            <div class="media-title" id="media-title">Name</div>
            <div class="media-controls">
                <button id="media-prev">&#9198;</button>
                <button id="media-play">&#9654;</button>
                <button id="media-next">&#9197;</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <form id="search-form">
            <input type="text" id="search-input" placeholder="SEARCH GEEK TAB" autocomplete="off">
        </form>

        <div class="shortcuts">
            <a href="https://youtube.com"><img src="images/youtube.png" alt="YouTube"></a>
            <a href="https://github.com"><img src="images/github.png" alt="GitHub"></a>
            <a href="https://everythingmoe.com"><img src="images/everythingmoe.png" alt="EverythingMoe"></a>
            <a href="https://anikoto.com"><img src="images/anikoto.png" alt="Anikoto"></a>
        </div>
    </div>

    <div class="quote-container">
        <p id="quote">Loading quote...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
